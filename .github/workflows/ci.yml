name: CLI validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Installed CLI reads offline example
        run: |
          set +e
          kube-triage --pods-file examples/pods.json --events-file examples/events.json -n demo --format markdown > report.md
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "CRASH_LOOP" report.md
          grep -q "FailedScheduling event" report.md
          ! grep -q "do-not-print" report.md
      - name: Verify module and syntax
        run: |
          python -m compileall -q src
          kube-triage --version
