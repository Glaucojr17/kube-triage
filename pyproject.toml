[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-triage"
version = "0.1.0"
description = "Read-only Kubernetes pod triage with actionable next steps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Glauco Candido Santana Junior"}]
keywords = ["kubernetes", "kubectl", "devops", "sre", "troubleshooting"]

[project.scripts]
kube-triage = "kubetriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
